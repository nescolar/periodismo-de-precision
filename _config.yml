title: Periodismo de Precisión y visualización de datos
description: Cuaderno del módulo. Del dato a la noticia con método estadístico.
lang: es

# Tema: Just the Docs, cargado directamente por GitHub Pages
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Cambie esta línea si su repositorio se llama distinto
baseurl: "/periodismo-de-precision"
url: "https://nescolar.github.io"

color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 2
  button: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Volver arriba"

# El menú lateral está en _includes/components/site_nav.html

footer_content: "Módulo de periodismo de precisión y visualización de datos. Universidad del Norte."

callouts_level: quiet
callouts:
  ojo:
    title: "¡Ojo!"
    color: red
  recordar:
    title: Para recordar
    color: blue
  clase:
    title: Para discutir en clase
    color: purple
  construccion:
    title: En construcción
    color: yellow

# Las páginas anteriores quedan guardadas en el repositorio, pero no se publican.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - antecedentes.md
  - que-es.md
  - precision-e-investigacion.md
  - estadistica.md
  - del-hallazgo-al-grafico.md
  - referencias.md
  - fundamentos
  - eda
  - inferencia
  - talleres

permalink: pretty
